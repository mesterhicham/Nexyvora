<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Circular shield -->
  <circle cx="100" cy="100" r="90" fill="url(#bg)" stroke="url(#border)" stroke-width="6"/>
  <circle cx="100" cy="100" r="78" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.5"/>
  <!-- Stylized Launch Leaf -->
  <path d="M96 46 C 135 50, 150 85, 142 122 C 132 144, 110 156, 88 152 C 60 148, 52 118, 58 92 C 64 66, 82 48, 96 46 Z" fill="url(#leaf)" filter="url(#glow)"/>
  <path d="M68 140 C 90 115, 115 95, 138 72" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
</svg>