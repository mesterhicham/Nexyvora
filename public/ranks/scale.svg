<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="50%" stop-color="#7e22ce"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e9d5ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Hexagon Shield -->
  <polygon points="100,14 176,56 176,144 100,186 24,144 24,56" fill="url(#bg)" stroke="url(#border)" stroke-width="6"/>
  <polygon points="100,26 164,63 164,137 100,174 36,137 36,63" fill="none" stroke="#c084fc" stroke-width="2" opacity="0.5"/>
  <!-- Laptop/Structure Icon -->
  <rect x="58" y="66" width="84" height="54" rx="6" fill="url(#screen)" filter="url(#glow)"/>
  <rect x="66" y="74" width="68" height="38" rx="2" fill="#581c87"/>
  <path d="M46 126 L 154 126 L 144 136 L 56 136 Z" fill="url(#screen)" filter="url(#glow)"/>
</svg>