<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="50%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="gem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#fecaca"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Octagonal / Diamond Crest -->
  <polygon points="100,12 165,38 188,100 165,162 100,188 35,162 12,100 35,38" fill="url(#bg)" stroke="url(#border)" stroke-width="6"/>
  <polygon points="100,24 153,46 172,100 153,154 100,176 47,154 28,100 47,46" fill="none" stroke="#fca5a5" stroke-width="2" opacity="0.5"/>
  <!-- Brilliant Cut Diamond -->
  <polygon points="70,68 130,68 152,94 100,152 48,94" fill="url(#gem)" filter="url(#glow)"/>
  <polygon points="70,68 130,68 116,94 84,94" fill="#ffffff" opacity="0.7"/>
  <polygon points="84,94 116,94 100,152" fill="#b91c1c" opacity="0.3"/>
  <polygon points="70,68 84,94 48,94" fill="#ffffff" opacity="0.5"/>
  <polygon points="130,68 152,94 116,94" fill="#f87171" opacity="0.5"/>
</svg>