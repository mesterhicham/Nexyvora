<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Classic Crown Crest Shield -->
  <path d="M100 14 C 150 14, 180 30, 180 80 C 180 135, 135 175, 100 188 C 65 175, 20 135, 20 80 C 20 30, 50 14, 100 14 Z" fill="url(#bg)" stroke="url(#border)" stroke-width="6"/>
  <path d="M100 26 C 142 26, 168 38, 168 80 C 168 127, 130 163, 100 174 C 70 163, 32 127, 32 80 C 32 38, 58 26, 100 26 Z" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.5"/>
  <!-- Crown Icon -->
  <polygon points="56,134 50,78 78,102 100,64 122,102 150,78 144,134" fill="url(#gold)" filter="url(#glow)"/>
  <circle cx="50" cy="74" r="5" fill="#ffffff"/>
  <circle cx="100" cy="60" r="6" fill="#ffffff"/>
  <circle cx="150" cy="74" r="5" fill="#ffffff"/>
  <rect x="54" y="136" width="92" height="10" rx="3" fill="#ffffff"/>
</svg>