<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="glowLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#86efac"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <circle cx="100" cy="100" r="90" fill="url(#bg)" stroke="url(#border)" stroke-width="6"/>
  <circle cx="100" cy="100" r="78" fill="none" stroke="#4ade80" stroke-width="2" opacity="0.5"/>
  <!-- Two Twin Growth Leaves -->
  <!-- Left Leaf -->
  <path d="M100 145 C 80 140, 56 122, 60 92 C 64 68, 86 64, 100 80 C 100 102, 100 125, 100 145 Z" fill="url(#glowLeaf)" filter="url(#glow)"/>
  <!-- Right Leaf -->
  <path d="M100 145 C 120 138, 144 116, 138 84 C 132 58, 108 56, 96 74 C 98 98, 99 122, 100 145 Z" fill="#ffffff" filter="url(#glow)"/>
  <path d="M100 152 L 100 85" stroke="#047857" stroke-width="3" stroke-linecap="round"/>
</svg>