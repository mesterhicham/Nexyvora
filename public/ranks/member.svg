<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <circle cx="100" cy="100" r="90" fill="url(#bg)" stroke="url(#border)" stroke-width="6"/>
  <circle cx="100" cy="100" r="76" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4" opacity="0.6"/>
  <!-- User / Star icon -->
  <path d="M100 50 A 25 25 0 0 1 100 100 A 25 25 0 0 1 100 50 Z" fill="#cbd5e1" filter="url(#glow)"/>
