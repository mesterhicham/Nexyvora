<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="50%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#164e63"/>
    </linearGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="plane" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a5f3fc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Shield with wing curves -->
  <path d="M100 16 L 176 46 C 176 112, 146 166, 100 186 C 54 166, 24 112, 24 46 Z" fill="url(#bg)" stroke="url(#border)" stroke-width="6"/>
  <path d="M100 28 L 164 54 C 164 108, 138 154, 100 172 C 62 154, 36 108, 36 54 Z" fill="none" stroke="#67e8f9" stroke-width="2" opacity="0.5"/>
  <!-- Supersonic Jet / Pioneer Wing -->
  <path d="M100 50 L 112 92 L 158 116 L 158 126 L 114 114 L 112 144 L 126 156 L 126 164 L 100 156 L 74 164 L 74 156 L 88 144 L 86 114 L 42 126 L 42 116 L 88 92 Z" fill="url(#plane)" filter="url(#glow)"/>
</svg>